[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepdoc-agent"
version = "0.4.0"
description = "Controlled multi-agent document research with citation verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "httpx>=0.28,<1",
  "langgraph>=1.2.11,<2",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
