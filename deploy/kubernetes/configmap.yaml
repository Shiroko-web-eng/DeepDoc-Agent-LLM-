apiVersion: v1
kind: ConfigMap
metadata:
  name: deepdoc-config
  namespace: deepdoc
data:
  DEEPDOC_ENV: production
  DEEPDOC_TASK_MODE: durable
  DEEPDOC_AUTO_MIGRATE: "false"
  DEEPDOC_STORAGE_BACKEND: s3
  DEEPDOC_S3_BUCKET: deepdoc-production
  DEEPDOC_S3_REGION: ap-east-1
  DEEPDOC_S3_PREFIX: deepdoc
  DEEPDOC_S3_SERVER_SIDE_ENCRYPTION: aws:kms
  DEEPDOC_AUTH_MODE: oidc
  DEEPDOC_OIDC_TENANT_CLAIM: tenant_id
  DEEPDOC_OIDC_ROLES_CLAIM: roles
  DEEPDOC_LLM_PROVIDER: openai-compatible
  DEEPDOC_EMBEDDING_PROVIDER: openai-compatible
  DEEPDOC_EMBEDDING_DIMENSIONS: "256"
  DEEPDOC_SERVICE_VERSION: "1.0.0"
  DEEPDOC_WORKER_LEASE_SECONDS: "60"
  DEEPDOC_WORKER_MAX_ATTEMPTS: "3"
  DEEPDOC_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
